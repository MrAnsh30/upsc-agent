name: UPSC daily agent

on:
  schedule:
    - cron: "30 0 * * *"      # 00:30 UTC = 06:00 IST (GitHub may delay scheduled runs by 10-60+ min)
  workflow_dispatch:           # manual "Run workflow" button for testing
    inputs:
      preview:
        description: "Preview: rebuild videos from today's stories WITHOUT changing the Sheet (tick for tests)"
        type: boolean
        default: false
      upload_youtube:
        description: "Upload the videos to YouTube as PRIVATE (for testing the upload)"
        type: boolean
        default: false
      privacy:
        description: "YouTube privacy for this manual run (private = safe; public = real public test)"
        type: choice
        options: [private, public]
        default: private
      max_videos:
        description: "Maximum number of videos to make (use 1 for a quick test)"
        type: string
        default: "2"
      retention_days:
        description: "Days before videos are deleted (normal = 10; type 0 to test deletion right now)"
        type: string
        default: "10"

permissions:
  contents: write              # used to save state/published.json + the keep-alive commit

concurrency:
  group: upsc-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      # optional knobs
      MAX_ITEMS: "10"
      MAX_VIDEOS: ${{ github.event.inputs.max_videos || '2' }}
      ITEMS_PER_VIDEO: "4"
      YT_PRIVACY: ${{ github.event.inputs.privacy || 'private' }}   # the daily run uploads as PRIVATE; to go public change 'private' here to 'public'
      PYTHONUNBUFFERED: "1"
      GEMINI_MODEL: "gemini-3.5-flash-lite"
      UPLOAD_YT: ${{ (github.event_name == 'schedule' || github.event.inputs.upload_youtube == 'true') && '1' || '0' }}   # the daily 6 AM run uploads; manual runs only if the box is ticked
      UPLOAD_IG: "0"             # set to "1" once Instagram is set up
      NARRATION_LANG: "hi"       # Hindi voice-over (on-screen text stays English); "en" = English voice
      TTS_VOICE: "hi-IN-SwaraNeural"
      TTS_RATE: "-4%"
      VIDEO_RETENTION_DAYS: ${{ github.event.inputs.retention_days || '10' }}   # videos are deleted after this many days
      CLEANUP_DRY_RUN: "0"       # set to "1" to only PRINT what would be deleted
      PREVIEW_MODE: ${{ github.event.inputs.preview == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: System packages (ffmpeg + fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: 1) Fetch, cluster, update Master Sheet, purge expired
        run: python fetch_and_cluster.py

      - name: 2) Generate short videos (Hindi voice-over)
        run: python video_generator.py

      - name: 3) Upload to YouTube Shorts + Instagram Reels
        run: python uploader.py

      - name: 4) Delete videos older than 10 days (never touches the Sheet)
        if: always()
        run: python cleanup.py

      - name: Keep artifacts (videos, logs) for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: |
            output/videos/*.mp4
            output/*.json
          retention-days: 3

      - name: Save state + keep-alive commit
        if: always()
        run: |
          mkdir -p state && date -u +"%Y-%m-%dT%H:%M:%SZ" > state/last_run.txt
          git config user.name  "upsc-agent[bot]"
          git config user.email "upsc-agent@users.noreply.github.com"
          git add state/
          git commit -m "chore: save state" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
